name: Refresh profile art

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'source-prepped.png'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_PROFILE_USER: sayanos-06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-profile.txt
      - run: python -m pip install -r scripts/requirements-profile.txt
      - name: Fetch public contributions and regenerate SVGs
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
          python scripts/make_ascii_svg.py
      - name: Commit refreshed files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json contrib-heatmap.svg stats.svg avi-ascii.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile contribution art'
            git push
          fi
